[package]
name = "claude-code-switcher"
version = "0.1.0"
edition = "2024"
description = "Troque a conta do Claude Code pela bandeja do sistema, sem derrubar sessoes em andamento"
license = "MIT"
readme = "README.md"
keywords = ["claude", "claude-code", "tray", "accounts"]
categories = ["command-line-utilities"]

[[bin]]
name = "ccswitch"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
dirs = "7.0.0"
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }

